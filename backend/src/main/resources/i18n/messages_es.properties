# Human messages of the public API, in Spanish.
#
# The key is the stable error code: the code is the contract and is never translated,
# the message is the presentation and follows the Accept-Language of the caller.

VALIDATION_ERROR=La solicitud no es válida.
IDEMPOTENCY_KEY_REQUIRED=El encabezado Idempotency-Key es obligatorio.
AUTHORIZATION_REQUIRED=Es necesario registrar la autorización antes de consultar la agenda.
AUTHORIZATION_NOT_FOUND=Autorización no encontrada.
BENEFICIARY_NOT_FOUND=Beneficiario no encontrado.
OPERATION_NOT_FOUND=Operación no encontrada.
IDEMPOTENCY_CONFLICT=La clave de idempotencia ya se usó con otro contenido.
INSTALLMENT_NOT_ELIGIBLE=Una o más cuotas no son elegibles.
CENTRAL_UNAVAILABLE=La Central de Convênios no está disponible.
INTERNAL_ERROR=Error interno.

