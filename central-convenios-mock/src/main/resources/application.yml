spring:
  application:
    name: central-convenios-mock

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    # The mock mirrors contracts/central-api.yaml, which is OpenAPI 3.1.
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

info:
  app:
    name: Central de Convênios Mock
    version: 0.1.0

mock:
  # Delay before the asynchronous confirmation. Until it elapses, the status endpoint
  # answers 204 with Retry-After, as the edital contract requires.
  confirmation-delay-ms: ${MOCK_CONFIRMATION_DELAY_MS:2000}
  # Delay injected on the first two status reads of a -TIMEOUT beneficiary.
  timeout-delay-ms: ${MOCK_TIMEOUT_DELAY_MS:6000}
  hmac:
    # Shared secret and tolerance from contracts/hmac-vector.json.
    enabled: ${MOCK_HMAC_ENABLED:true}
    secret: ${MOCK_HMAC_SECRET:consigport-hmac-test-secret-2026}
    tolerance-seconds: ${MOCK_HMAC_TOLERANCE_SECONDS:300}

---
# Local profile: mock on the compose.yaml network, verbose project logs.
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    br.com.consigport.central: DEBUG
