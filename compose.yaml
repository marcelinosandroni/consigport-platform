services:
  postgres:
    image: postgres:16-alpine
    container_name: consigport-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-consigport}
      POSTGRES_USER: ${POSTGRES_USER:-consigport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consigport}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - consigport-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-consigport} -d ${POSTGRES_DB:-consigport}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    name: consigport-postgres-data

networks:
  consigport-net:
    name: consigport-net
    driver: bridge
