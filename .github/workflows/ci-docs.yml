name: CI Docs & Specifications

on:
  push:
    branches:
      - main
      - staging
      - develop
    paths:
      - '**.md'
      - 'SDD/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/ci-docs.yml'
  pull_request:
    branches:
      - main
      - staging
      - develop
    paths:
      - '**.md'
      - 'SDD/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/ci-docs.yml'

jobs:
  validate-docs:
    name: Validate Markdown Links & Specs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check relative Markdown links
        run: node SDD/SKILLS/check-docs/check-docs.mjs .

      - name: Validate SDD specification invariants
        run: node scripts/check-specs.mjs

      - name: Validate architecture diagrams and traceability
        run: node scripts/check-architecture.mjs

      - name: Validate the AI usage log
        run: node scripts/check-ai-log.mjs
        env:
          AI_LOG_BASE_SHA: ${{ github.event.pull_request.base.sha }}
