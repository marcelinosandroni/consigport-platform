spring:
  application:
    name: consigport-backend

  # pt-BR is the default locale of the API (BR-16); Accept-Language still wins.
  web:
    locale: pt-BR

  # Single .env drives both Docker Compose and a bare-metal run: the URL points
  # at localhost by default and Compose overrides it with the service hostname.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/consigport}
    username: ${POSTGRES_USER:consigport}
    password: ${POSTGRES_PASSWORD:consigport}

  jpa:
    open-in-view: false
    hibernate:
      # The schema belongs to Flyway; Hibernate only verifies it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# Integration with the Central de Convênios: the URL, the shared secret of the HMAC
# and the resilience of the client (ARCHITECTURE.md §11 and §13).
central:
  base-url: ${CENTRAL_BASE_URL:http://localhost:8081}
  hmac:
    secret: ${HMAC_SECRET:consigport-hmac-test-secret-2026}
  retry:
    max-attempts: ${CENTRAL_RETRY_MAX_ATTEMPTS:3}
    delay: ${CENTRAL_RETRY_DELAY:500ms}
  timeout:
    connect: ${CENTRAL_TIMEOUT_CONNECT:2s}
    read: ${CENTRAL_TIMEOUT_READ:3s}
  integration:
    # How long the operation waits before the next attempt, when the Central fails.
    backoff: ${CENTRAL_INTEGRATION_BACKOFF:60s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
    # The versioned contract in contracts/ is OpenAPI 3.1; keep the runtime doc aligned.
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

info:
  app:
    name: ConsigPort Backend
    version: 0.1.0

---
# Local profile: PostgreSQL from compose.yaml on localhost, verbose project logs.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/consigport}

logging:
  level:
    br.com.consigport: DEBUG
