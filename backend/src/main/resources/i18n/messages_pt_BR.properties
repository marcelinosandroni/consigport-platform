# Human messages of the public API, in Brazilian Portuguese (the default locale).
#
# The key is the stable error code: the code is the contract and is never translated,
# the message is the presentation and follows the Accept-Language of the caller.

VALIDATION_ERROR=A requisição é inválida.
IDEMPOTENCY_KEY_REQUIRED=O header Idempotency-Key é obrigatório.
AUTHORIZATION_REQUIRED=É necessário registrar a autorização antes de consultar a agenda.
AUTHORIZATION_NOT_FOUND=Autorização não encontrada.
BENEFICIARY_NOT_FOUND=Beneficiário não encontrado.
OPERATION_NOT_FOUND=Operação não encontrada.
IDEMPOTENCY_CONFLICT=A chave de idempotência já foi usada com outro conteúdo.
INSTALLMENT_NOT_ELIGIBLE=Uma ou mais parcelas não são elegíveis.
CENTRAL_UNAVAILABLE=A Central de Convênios está indisponível.
INTERNAL_ERROR=Erro interno.

# Messages of the validation of the request (Jakarta Bean Validation).
jakarta.validation.constraints.NotBlank.message=não deve estar em branco
jakarta.validation.constraints.NotEmpty.message=não deve estar vazio
jakarta.validation.constraints.NotNull.message=não deve ser nulo
jakarta.validation.constraints.Size.message=tamanho deve ser entre {min} e {max}
