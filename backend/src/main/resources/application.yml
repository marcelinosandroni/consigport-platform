spring:
  application:
    name: consigport-backend

  # pt-BR is the default locale of the API (BR-16); Accept-Language still wins.
  web:
    locale: pt-BR

  # Single .env drives both Docker Compose and a bare-metal run: the URL points
  # at localhost by default and Compose overrides it with the service hostname.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/consigport}
    username: ${POSTGRES_USER:consigport}
    password: ${POSTGRES_PASSWORD:consigport}

  jpa:
    open-in-view: false
    hibernate:
      # The schema belongs to Flyway; Hibernate only verifies it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# Integration with the Central de Convênios: the URL, the shared secret of the HMAC
# and the resilience of the client (ARCHITECTURE.md §11 and §13).
central:
  base-url: ${CENTRAL_BASE_URL:http://localhost:8081}
  hmac:
    secret: ${HMAC_SECRET:consigport-hmac-test-secret-2026}
  retry:
    max-attempts: ${CENTRAL_RETRY_MAX_ATTEMPTS:3}
    delay: ${CENTRAL_RETRY_DELAY:500ms}
  timeout:
    connect: ${CENTRAL_TIMEOUT_CONNECT:2s}
    read: ${CENTRAL_TIMEOUT_READ:3s}
  integration:
    # How long the operation waits before the next attempt, when the Central fails.
    backoff: ${CENTRAL_INTEGRATION_BACKOFF:60s}
  poll:
    # The worker that follows the operations until the Central answers.
    enabled: ${CENTRAL_POLL_ENABLED:true}
    # The interval between two polls, used when the Central does not send a Retry-After.
    interval: ${CENTRAL_POLL_INTERVAL:2s}
    # How often the worker wakes up and how many operations it polls at once.
    fixed-delay: ${CENTRAL_POLL_FIXED_DELAY:2s}
    batch-size: ${CENTRAL_POLL_BATCH_SIZE:20}
    backoff:
      # The wait doubles with every failure and never passes the ceiling.
      base: ${CENTRAL_POLL_BACKOFF_BASE:2s}
      ceiling: ${CENTRAL_POLL_BACKOFF_CEILING:60s}
  circuit:
    # The circuit that stops the calls to a Central that is failing.
    window-size: ${CENTRAL_CIRCUIT_WINDOW_SIZE:10}
    failure-threshold: ${CENTRAL_CIRCUIT_FAILURE_THRESHOLD:0.5}
    open-duration: ${CENTRAL_CIRCUIT_OPEN_DURATION:10s}
    half-open-calls: ${CENTRAL_CIRCUIT_HALF_OPEN_CALLS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
    # The versioned contract in contracts/ is OpenAPI 3.1; keep the runtime doc aligned.
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

info:
  app:
    name: ConsigPort Backend
    version: 0.1.0

---
# Local profile: PostgreSQL from compose.yaml on localhost, verbose project logs.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/consigport}

logging:
  level:
    br.com.consigport: DEBUG
