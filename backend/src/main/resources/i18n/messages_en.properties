# Human messages of the public API, in English.
#
# The key is the stable error code: the code is the contract and is never translated,
# the message is the presentation and follows the Accept-Language of the caller.

VALIDATION_ERROR=The request is invalid.
IDEMPOTENCY_KEY_REQUIRED=The Idempotency-Key header is required.
AUTHORIZATION_REQUIRED=The authorization must be registered before the agenda is queried.
AUTHORIZATION_NOT_FOUND=Authorization not found.
BENEFICIARY_NOT_FOUND=Beneficiary not found.
OPERATION_NOT_FOUND=Operation not found.
IDEMPOTENCY_CONFLICT=The idempotency key was already used with another payload.
INSTALLMENT_NOT_ELIGIBLE=One or more installments are not eligible.
CENTRAL_UNAVAILABLE=The Central de Convênios is unavailable.
INTERNAL_ERROR=Internal error.

# Messages of the validation of the request (Jakarta Bean Validation).
jakarta.validation.constraints.NotBlank.message=must not be blank
jakarta.validation.constraints.NotEmpty.message=must not be empty
jakarta.validation.constraints.NotNull.message=must not be null
jakarta.validation.constraints.Size.message=size must be between {min} and {max}
